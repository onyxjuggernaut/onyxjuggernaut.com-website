<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OnyxJuggernaut | Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#07050c;
  --panel:#120b1e;
  --panel2:#1a1028;
  --text:#fff;
  --muted:#b8aec8;
  --purple:#a855f7;
  --cyan:#22d3ee;
  --gold:#fbbf24;
  --line:rgba(168,85,247,.28);
  --sidebar-w:264px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Inter,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 0,rgba(168,85,247,.2),transparent 30%),
    radial-gradient(circle at 88% 25%,rgba(34,211,238,.09),transparent 28%),
    var(--bg);
  min-height:100vh;
  font-size:18px;
  line-height:1.7;
}
a{color:var(--purple)}

.eyebrow{display:inline-flex;align-items:center;gap:10px;color:#e9d5ff;font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px}
.eyebrow:before{content:"";width:34px;height:2px;background:linear-gradient(90deg,var(--purple),var(--cyan))}

h1,h2,h3{font-family:Orbitron,sans-serif;text-transform:uppercase}
.gradient{background:linear-gradient(90deg,#fff 8%,#d8b4fe 48%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- LAYOUT ---------- */
.app{display:flex;min-height:100vh}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:rgba(18,11,30,.92);
  border-right:1px solid var(--line);
  backdrop-filter:blur(18px);
  display:flex;
  flex-direction:column;
  padding:30px 22px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.sidebar .brand{display:block;text-decoration:none;margin-bottom:30px}
.sidebar .brand img{width:100%;max-width:180px;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 0 18px rgba(168,85,247,.35))}

.sidebar-nav{display:flex;flex-direction:column;gap:8px;margin-bottom:auto}
.sidebar-nav a{
  font-family:Orbitron,sans-serif;
  font-weight:700;
  font-size:14px;
  letter-spacing:.06em;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--muted);
  padding:14px 16px;
  border-radius:12px;
  border:1px solid transparent;
  transition:.2s;
}
.sidebar-nav a:hover{color:#fff;border-color:var(--line);background:rgba(255,255,255,.03)}
.sidebar-nav a.active{
  color:#fff;
  background:linear-gradient(90deg,rgba(168,85,247,.28),rgba(34,211,238,.14));
  border-color:var(--purple);
  box-shadow:0 0 24px rgba(168,85,247,.18);
}

.sidebar-footer{margin-top:28px;padding-top:22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.social-row{display:flex;gap:10px;justify-content:center}
.social-icon{width:46px;height:46px;display:grid;place-items:center;color:#fff;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.05);transition:.2s}
.social-icon:hover{transform:translateY(-2px);border-color:var(--purple);box-shadow:0 0 24px rgba(168,85,247,.35)}
.social-icon svg{width:22px;height:22px}

.live-badge{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border-radius:14px;text-decoration:none;color:#ddd;background:#19151f;border:1px solid rgba(255,255,255,.1);font-family:Orbitron,sans-serif;font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.dot{width:9px;height:9px;border-radius:50%;background:#888}
.live-badge.is-live{color:#fff;background:rgba(34,197,94,.15);border-color:#22c55e}
.live-badge.is-live .dot{background:#22c55e;box-shadow:0 0 12px #22c55e}

@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:16px;padding:18px 20px}
  .sidebar .brand{margin-bottom:0}
  .sidebar .brand img{max-width:110px}
  .sidebar-nav{flex-direction:row;flex-wrap:wrap;margin-bottom:0;gap:6px}
  .sidebar-nav a{padding:9px 12px;font-size:12px}
  .sidebar-footer{margin-top:0;padding-top:0;border-top:none;flex-direction:row;align-items:center;margin-left:auto}
}

/* ---------- MAIN ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}

.page-hero{max-width:1180px;margin:0 auto;padding:clamp(56px,8vh,90px) 24px 60px}
.page-hero h1{font-size:clamp(38px,5.5vw,68px);line-height:1.05;letter-spacing:-.03em}
.page-hero .sub{margin-top:24px;max-width:680px;color:var(--muted);font-size:clamp(17px,1.6vw,20px)}
.page-hero .sub strong{color:#fff}
.cta-row{display:flex;gap:16px;margin-top:32px;flex-wrap:wrap}
.btn{font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;padding:16px 30px;border-radius:14px;color:#07050c;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:.2s;display:inline-block}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(168,85,247,.35)}
.btn.btn-outline{color:#fff;background:transparent;border:1px solid var(--line)}
.btn.btn-outline:hover{border-color:var(--purple);box-shadow:0 0 24px rgba(168,85,247,.25)}

section.content{max-width:1180px;margin:0 auto;padding:20px 24px 60px}
.section-head{margin-bottom:36px}
.section-head h2{font-size:clamp(28px,4vw,42px)}
.section-head p{max-width:640px;color:var(--muted);margin-top:12px;font-size:17px;line-height:1.65}

.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.27)}

/* Home feature grid */
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:10px}
.feature-grid .card h3{font-size:19px;margin:14px 0 8px;color:#fff}
.feature-grid .card p{color:var(--muted);font-size:16px}
.feature-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(168,85,247,.15);border:1px solid var(--line);color:var(--cyan)}
.feature-icon svg{width:22px;height:22px}
@media(max-width:900px){.feature-grid{grid-template-columns:1fr}}

/* Schedule page */
.schedule-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:900px){.schedule-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.schedule-grid{grid-template-columns:1fr}}
.day-card{text-align:center;padding:26px 16px}
.day-card .day{font-family:Orbitron;font-size:15px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
.day-card .time{font-family:Orbitron;font-size:20px;color:#fff}
.day-card.fixed{border-color:var(--purple)}
.day-card.fixed .time{background:linear-gradient(90deg,#fff,#d8b4fe);-webkit-background-clip:text;background-clip:text;color:transparent}
.day-card.spontaneous{border-style:dashed}
.day-card.spontaneous .time{color:var(--gold);font-size:15px;letter-spacing:.03em}
.schedule-note{margin-top:28px;color:var(--muted);font-size:15px;max-width:680px}

/* Shop page */
.shop-intro{max-width:700px;margin-bottom:44px}
.shop-intro p{color:var(--muted);font-size:19px}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media(max-width:900px){.product-grid{grid-template-columns:1fr}}
.product-card{overflow:hidden;padding:0}
.product-card .thumb{height:180px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(168,85,247,.18),rgba(34,211,238,.1));border-bottom:1px solid var(--line)}
.product-card .thumb svg{width:52px;height:52px;color:var(--purple);opacity:.7}
.product-card .info{padding:22px}
.product-card h3{font-size:16px;color:#fff;margin-bottom:8px}
.soon-pill{display:inline-block;font-family:Orbitron;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);padding:5px 10px;border-radius:999px}

/* Contact page */
.contact-wrap{max-width:560px}
.contact-form{display:flex;flex-direction:column;gap:18px}
.contact-form label{font-family:Orbitron;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block}
.contact-form input,.contact-form textarea{
  width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);color:#fff;font-family:Inter,sans-serif;font-size:16px;
}
.contact-form input:focus,.contact-form textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.contact-form textarea{min-height:160px;resize:vertical}
.contact-form button{
  font-family:Orbitron,sans-serif;font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;
  padding:16px 30px;border-radius:14px;color:#07050c;background:linear-gradient(90deg,var(--purple),var(--cyan));
  border:none;cursor:pointer;transition:.2s;
}
.contact-form button:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(168,85,247,.35)}
.contact-form .hp{position:absolute;left:-9999px}

footer{margin-top:auto;text-align:center;border-top:1px solid var(--line);padding:36px 20px 46px;color:#81768f;font-size:14px}
footer p+p{margin-top:6px}

</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <a href="index.html" class="brand">
      <img src="logo.png" alt="OnyxJuggernaut logo">
    </a>
    <nav class="sidebar-nav">
      <a href="index.html" class="">Home</a>
      <a href="schedule.html" class="">Stream Schedule</a>
      <a href="events.html" class="">Events and Special Streams</a>
      <a href="shop.html" class="">Shop</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <div class="sidebar-footer">
      <div class="social-row">
        <a class="social-icon" href="https://www.tiktok.com/@onyxjuggernaut?is_from_webapp=1&sender_device=pc" target="_blank" rel="noopener" aria-label="TikTok">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.82c-.7-.77-1.1-1.76-1.1-2.82h-3.1v13.36c0 1.56-1.27 2.83-2.83 2.83a2.83 2.83 0 0 1-2.83-2.83 2.83 2.83 0 0 1 2.83-2.83c.28 0 .55.04.8.12v-3.15c-.27-.04-.53-.06-.8-.06A5.94 5.94 0 0 0 3.64 16.4a5.94 5.94 0 0 0 5.93 5.94 5.94 5.94 0 0 0 5.93-5.94V9.02a7.9 7.9 0 0 0 4.6 1.47V7.4a4.85 4.85 0 0 1-3.5-1.58z"/></svg>
        </a>
        <a class="social-icon" href="https://discord.gg/GzUb8BF6wR" target="_blank" rel="noopener" aria-label="Discord">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 5.4A17.6 17.6 0 0 0 15.9 4a12.5 12.5 0 0 0-.6 1.2 16.3 16.3 0 0 0-4.8 0A12.5 12.5 0 0 0 9.9 4a17.5 17.5 0 0 0-4.4 1.4C2.9 8.8 2.2 12.1 2.5 15.3a17.7 17.7 0 0 0 5.4 2.7c.4-.6.8-1.2 1.1-1.9-.6-.2-1.2-.5-1.8-.9.2-.1.3-.3.5-.4a12.6 12.6 0 0 0 10.6 0c.2.1.3.3.5.4-.6.4-1.2.6-1.8.9.3.7.7 1.3 1.1 1.9a17.6 17.6 0 0 0 5.4-2.7c.4-3.7-.6-7-2.2-9.9zM9.7 13.5c-.8 0-1.4-.7-1.4-1.6 0-.9.6-1.6 1.4-1.6.8 0 1.4.7 1.4 1.6 0 .9-.6 1.6-1.4 1.6zm5.6 0c-.8 0-1.4-.7-1.4-1.6 0-.9.6-1.6 1.4-1.6.8 0 1.4.7 1.4 1.6 0 .9-.6 1.6-1.4 1.6z"/></svg>
        </a>
        <a class="social-icon" href="https://www.youtube.com/@onyxjuggernaut" target="_blank" rel="noopener" aria-label="YouTube">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12s0-3.4-.44-5.02a3 3 0 0 0-2.1-2.1C17.8 4.4 12 4.4 12 4.4s-5.8 0-7.46.48a3 3 0 0 0-2.1 2.1C2 8.6 2 12 2 12s0 3.4.44 5.02a3 3 0 0 0 2.1 2.1C6.2 19.6 12 19.6 12 19.6s5.8 0 7.46-.48a3 3 0 0 0 2.1-2.1C22 15.4 22 12 22 12Z"/><path d="M10 15.2 15.5 12 10 8.8v6.4Z" fill="#07050c"/></svg>
        </a>
      </div>
      <a id="live-badge" class="live-badge" href="https://www.tiktok.com/@onyxjuggernaut" target="_blank" rel="noopener">
        <span class="dot"></span>
        <span id="live-badge-text">Offline</span>
      </a>
    </div>
  </div>
  <main>
    <section class="content" style="padding-top:56px;">
      <div class="section-head">
        <span class="eyebrow">Get In Touch</span>
        <h2>Contact</h2>
        <p>Business inquiries, collabs, questions — send a message below and it'll land straight in my inbox.</p>
      </div>

      <div class="contact-wrap">
        <form class="contact-form" action="https://formsubmit.co/4b10c6b8d6fd797cd8610bfe41c734fe" method="POST">
          <input type="hidden" name="_subject" value="New message from onyxjuggernaut.com">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_captcha" value="true">
          <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">

          <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="Name" required>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="Email" required>
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="Message" required></textarea>
          </div>
          <button type="submit">Send Message</button>
        </form>
      </div>
    </section>

    <footer>
    <p>&copy; <span id="year"></span> OnyxJuggernaut</p>
  </footer>
  </main>
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  fetch('status.json?_=' + Date.now())
    .then(r => r.json())
    .then(data => {
      const badge = document.getElementById('live-badge');
      const text = document.getElementById('live-badge-text');
      if (data.live) {
        badge.classList.add('is-live');
        text.textContent = 'Live Now';
      } else {
        badge.classList.remove('is-live');
        text.textContent = 'Offline';
      }
    })
    .catch(() => { /* status.json missing or unreachable — badge stays at default "Offline" */ });
</script>

</body>
</html>
